<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>震动测试</title>
<style>body{font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 20px;background:#efe6d6}
button{font-size:22px;padding:22px 30px;border:none;border-radius:20px;background:#5aa83e;color:#fff;width:100%;max-width:320px}
#log{font-size:15px;color:#555;text-align:center;line-height:1.7}
label.vis{font-size:18px;display:flex;gap:10px;align-items:center}</style></head><body>
<h2>震动测试</h2>
<button id="a">① 点我（隐藏开关法）</button>
<button id="b" style="background:#e0a020">② 点我（安卓 vibrate）</button>
<label class="vis"><input type="checkbox" switch> ③ 直接拨这个系统开关</label>
<div id="log">iOS 18+ 的 Safari：① 和 ③ 应该都有轻轻一下“嗒”。<br>③ 都没感觉的话，多半是手机设置里关了「系统触感」。</div>
<script>
const ios = () => { const l = document.createElement('label'); l.ariaHidden = 'true'; l.style.display = 'none'; const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i); document.head.appendChild(l); l.click(); document.head.removeChild(l); };
const log = t => document.getElementById('log').innerHTML = t;
document.getElementById('a').onclick = () => { ios(); log('已触发 ① ' + new Date().toLocaleTimeString()); };
document.getElementById('b').onclick = () => { log(navigator.vibrate ? (navigator.vibrate(60) ? '已触发 ②' : 'vibrate 被拒绝') : '这台手机不支持 vibrate（iPhone 正常现象）'); };
</script></body></html>
