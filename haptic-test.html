<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>震动测试2</title>
<style>body{font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 20px;background:#efe6d6}
button{font-size:20px;padding:18px 20px;border:none;border-radius:18px;background:#5aa83e;color:#fff;width:100%;max-width:340px}
#log{font-size:15px;color:#555;text-align:center;line-height:1.7}
.hide{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;overflow:hidden}
#E{position:relative;overflow:hidden}
#E input{position:absolute;inset:0;width:100%;height:100%;opacity:0.01;margin:0}</style></head><body>
<h2>震动测试 2</h2>
<button id="A">A 隐藏(display:none)标签</button>
<button id="B">B 页面里常驻、几乎透明的标签</button>
<button id="C">C 直接点开关本身 input.click()</button>
<button id="D">D 常驻标签 + 按下时就触发</button>
<button id="E">E 按钮下面垫一个透明的真开关<input type="checkbox" switch></button>
<label class="vis" style="font-size:18px"><input type="checkbox" switch> F 手拨开关（对照）</label>
<div id="log">分别点 A~E，告诉我哪几个有“嗒”一下</div>
<label class="hide" id="Bl"><input type="checkbox" switch id="Bi"></label>
<script>
const log = t => document.getElementById('log').textContent = t + ' ' + new Date().toLocaleTimeString();
document.getElementById('A').onclick = () => { const l = document.createElement('label'); l.style.display = 'none'; const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i); document.head.appendChild(l); l.click(); l.remove(); log('A'); };
document.getElementById('B').onclick = () => { document.getElementById('Bl').click(); log('B'); };
document.getElementById('C').onclick = () => { document.getElementById('Bi').click(); log('C'); };
document.getElementById('D').addEventListener('pointerdown', () => { document.getElementById('Bl').click(); log('D'); });
document.getElementById('E').onclick = () => log('E');
</script></body></html>
