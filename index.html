<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>盆景剪影</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#efe6d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #efe6d6; color: #3e3428;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; -webkit-user-select: none; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    .hud { position: fixed; top: 0; left: 0; right: 0; z-index: 6; display: flex; align-items: center; gap: 8px;
        padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .pill { background: rgba(255, 255, 255, .9); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 800; box-shadow: 0 2px 0 rgba(90, 70, 40, .15); white-space: nowrap; }
    .pill b { color: #b8862a; }
    .sp { flex: 1; }
    .btn { background: linear-gradient(#ffcf5a, #f0a020); color: #4a2a00; border: none; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 800;
        font-family: inherit; cursor: pointer; white-space: nowrap; box-shadow: 0 3px 0 #b8700a, 0 5px 10px rgba(0, 0, 0, .12); }
    .btn.ghost { background: rgba(255, 255, 255, .94); color: #3e3428; box-shadow: 0 2px 0 rgba(90, 70, 40, .2); }
    .btn.green { background: linear-gradient(#8fd06a, #5aa83e); color: #fff; box-shadow: 0 3px 0 #3d7a28, 0 5px 10px rgba(0, 0, 0, .12); }
    .btn:active { transform: translateY(2px); }
    .btn:disabled { opacity: .45; }
    .hidden { display: none !important; }
    .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom));
        display: flex; align-items: center; gap: 10px; pointer-events: none; }
    .bottom > * { pointer-events: auto; }
    .meter { flex: 1; background: rgba(255, 255, 255, .92); border-radius: 16px; padding: 6px 10px 8px; box-shadow: 0 2px 0 rgba(90, 70, 40, .15); }
    .meter .t { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; }
    .meter .t b { font-size: 16px; color: #5a8a3a; }
    .meter .bar { position: relative; height: 10px; border-radius: 5px; background: #e8dcc6; margin-top: 4px; overflow: hidden; }
    .meter .bar i { display: block; height: 100%; background: linear-gradient(90deg, #a8d07a, #5aa83e); transition: width .25s; }
    .seal { position: fixed; z-index: 15; width: 66px; height: 66px; border-radius: 9px; background: #b8322a; color: #fbeee0; pointer-events: none;
        display: flex; align-items: center; justify-content: center; text-align: center; font: 900 25px/1.02 "STKaiti", "Kaiti SC", "KaiTi", "Songti SC", serif;
        box-shadow: inset 0 0 0 3px #b8322a, inset 0 0 0 5px rgba(251, 238, 224, .85), 0 3px 8px rgba(80, 20, 10, .25); opacity: .93; transform: translate(-50%, -50%) rotate(-9deg);
        animation: stamp .42s cubic-bezier(.5, 0, .7, 1.4) both; }
    @keyframes stamp { 0% { transform: translate(-50%, -50%) rotate(-20deg) scale(2.8); opacity: 0; } 70% { transform: translate(-50%, -50%) rotate(-9deg) scale(.9); opacity: .95; } 100% { transform: translate(-50%, -50%) rotate(-9deg) scale(1); opacity: .93; } }
    .meter.perfect { background: linear-gradient(90deg, #fff6d8, #ffe9a8); box-shadow: 0 0 0 3px rgba(232, 180, 64, .55), 0 2px 0 rgba(90, 70, 40, .15); }
    .meter.perfect .t b { color: #b8862a; } .meter.perfect .bar i { background: linear-gradient(90deg, #f2c94c, #e0a020); }
    #doneBtn.ready { animation: doneBob 1s ease-in-out infinite; }
    @keyframes doneBob { 50% { transform: translateY(-4px) scale(1.06); box-shadow: 0 3px 0 #3d7a28, 0 0 0 6px rgba(140, 210, 100, .35); } }
    .meter.good { animation: mGood .45s ease-out; } .meter.bad { animation: mBad .45s ease-out; }
    @keyframes mGood { 30% { box-shadow: 0 0 0 4px rgba(110, 190, 80, .55), 0 2px 0 rgba(90, 70, 40, .15); transform: scale(1.03); } }
    @keyframes mBad { 30% { box-shadow: 0 0 0 4px rgba(220, 90, 70, .5), 0 2px 0 rgba(90, 70, 40, .15); transform: translateX(-4px); } 60% { transform: translateX(4px); } }
    .pop.good { color: #4a9a3a; font-size: 18px; } .pop.bad { color: #d0503a; font-size: 18px; }
    .pop.combo { color: #e07a1a; font-size: 26px; letter-spacing: 2px; }
    .meter .bar u { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(90, 60, 30, .45); }
    .bottom .btn { font-size: 16px; padding: 12px 18px; }
    .card-bg { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(60, 50, 35, .4); }
    .card-bg.show { display: flex; animation: fade .25s; }
    @keyframes fade { from { opacity: 0; } }
    .card { width: min(90vw, 400px); max-height: 86vh; overflow: auto; padding: 14px 16px 16px; border-radius: 22px; text-align: center; background: #fbf7ef;
        border: 3px solid #e6d6b8; box-shadow: 0 16px 40px rgba(0, 0, 0, .25); animation: cardIn .4s cubic-bezier(.3, 1.5, .5, 1); scrollbar-width: none; }
    .card::-webkit-scrollbar { display: none; }
    @keyframes cardIn { from { transform: scale(.7); opacity: 0; } }
    .ctop { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; gap: 8px; margin: -2px -4px 4px 0; }
    .card h2 { margin: 0 0 4px; font-size: 21px; }
    .card h3 { margin: 10px 0 6px; font-size: 14px; text-align: left; opacity: .8; }
    .card .sub { font-size: 14px; line-height: 1.7; opacity: .9; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: #fff; border: 2px solid #e6d6b8; border-radius: 14px; padding: 4px 6px 6px; font-size: 12px; font-weight: 800; cursor: pointer; width: calc(25% - 5px); }
    .chip canvas { width: 100%; height: auto; display: block; }
    .chip.on { border-color: #5aa83e; background: #f0f8e8; }
    .chip.off { opacity: .4; cursor: default; }
    .chip small { display: block; font-size: 10px; color: #b8862a; }
    .stars { color: #f0a020; font-size: 26px; letter-spacing: 3px; }
    .work { width: 220px; height: 260px; display: block; margin: 4px auto; border-radius: 16px; }
    .garden { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .garden div { background: #fff; border-radius: 12px; padding: 4px; font-size: 11px; font-weight: 800; box-shadow: 0 2px 0 #e6d6b8; }
    .garden img { width: 100%; display: block; border-radius: 8px; }
    .ref { position: fixed; right: 8px; z-index: 6; width: 104px; background: rgba(255, 255, 255, .82); border-radius: 14px; padding: 5px 6px 6px;
        box-shadow: 0 2px 0 rgba(90, 70, 40, .15); text-align: center; font-size: 11px; font-weight: 800; pointer-events: none; }
    .ref canvas { width: 94px; height: 100px; display: block; margin: 0 auto; }
    .pop { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%); font-weight: 900; font-size: 15px; color: #7a5a2a;
        text-shadow: 0 2px 0 #fff; animation: pop 1.2s ease-out forwards; white-space: nowrap; }
    .pop.big { font-size: 19px; color: #5a8a3a; }
    @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); } 100% { opacity: 0; transform: translate(-50%, -160%); } }
</style>

<body>
<canvas id="c"></canvas>
<div class="hud">
    <div class="pill" id="coinPill">💰 <b id="coins">0</b></div>
    <div class="pill" id="formPill">🌳 <span id="formName"></span></div>
    <div class="sp"></div>
    <button class="btn ghost" id="bookBtn">图鉴</button>
    <button class="btn ghost" id="gardenBtn">园子</button>
</div>
<div class="ref hidden" id="ref"><canvas id="refCv" width="188" height="200"></canvas><div id="refName">目标</div></div>
<div class="bottom">
    <div class="meter"><div class="t"><span>完成度</span><b id="simTxt">0%</b></div><div class="bar"><i id="simBar"></i><u style="left:55%"></u><u style="left:75%"></u><u style="left:88%"></u></div></div>
    <button class="btn green" id="doneBtn">完成</button>
</div>
<div class="card-bg" id="cardBg"><div class="card" id="card"></div></div>

<script>
// ============================================================
// 基础
// ============================================================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = id => document.getElementById(id);
const cvs = $('c'); let ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1, T = 0;
let S = 150, ROOT_X = 0, ROOT_Y = 0, TABLE_Y = 0;     // S = 一个单位多少像素；根在盆口中间
const U2X = u => ROOT_X + u * S, U2Y = v => ROOT_Y + (v - 1) * S;

// ============================================================
// 声音
// ============================================================
let AC = null, NOISE = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, dur, vol, type = 'sine', delay = 0, f1) {
    if (!AC) return;
    const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, freq, vol, delay = 0, q = 1) {
    if (!AC) return;
    if (!NOISE) { NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = NOISE; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g).connect(AC.destination); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
}
const sfx = {
    snip() { noise(0.05, rand(3500, 5000), 0.06, 0, 2); tone(2400, 0.03, 0.02, 'square'); },
    rustle(v = 0.03) { noise(0.3, 1800, v, 0, 0.6); noise(0.2, 3200, v * 0.6, 0.05, 0.8); },
    dull() { tone(160, 0.12, 0.06, 'triangle'); },
    done() { [0, 4, 7, 12].forEach((k, i) => tone(523 * Math.pow(2, k / 12), 0.45, 0.045, 'triangle', i * 0.08)); },
    coin() { tone(1300, 0.06, 0.04, 'square'); tone(1900, 0.09, 0.03, 'square', 0.05); },
    grow() { tone(330, 0.5, 0.025, 'sine', 0, 660); },
};

// ============================================================
// 剪影（造型）：冠部 = 若干椭圆（单位坐标，盆口中心是 (0,1)，向上 y 变小）
// trunks = 主干走向的折线（决定树干怎么长；悬崖式向一侧垂下）
// ============================================================
// 剪影 = 经典盆景样式。pads = 一片片扁平的叶层 [cx, cy, rx, ry]；trunks = 主干走向（单位坐标，盆口中心 (0,1)，向上 y 变小）
const FORMS = [
    { id: 'chokkan', name: '直干式', origin: '日式', d: '主干笔直，叶层左右交错往上收成三角形',
        trunks: [[[0, 1], [0.02, 0.3], [0, -0.75]]],
        blobs: [[-0.42, 0.36, 0.36, 0.1], [0.42, 0.13, 0.36, 0.1], [-0.36, -0.12, 0.3, 0.09], [0.32, -0.34, 0.27, 0.09], [0, -0.52, 0.24, 0.09], [0, -0.78, 0.17, 0.1]] },
    { id: 'shakan', name: '斜干式', origin: '日式', d: '主干斜着伸出去，另一侧留一片叶层压住重心',
        trunks: [[[0, 1], [0.25, 0.45], [0.55, -0.3]]],
        blobs: [[-0.18, 0.38, 0.3, 0.1], [0.75, 0.18, 0.3, 0.1], [0.2, -0.02, 0.28, 0.09], [0.78, -0.2, 0.24, 0.09], [0.55, -0.48, 0.26, 0.12]] },
    { id: 'moyogi', name: '模样木', origin: '日式 · 曲干', d: '主干 S 形弯曲，叶层长在每个弯的外侧',
        trunks: [[[0, 1], [0.22, 0.62], [-0.1, 0.22], [0.12, -0.2], [-0.02, -0.66]]],
        blobs: [[0.52, 0.45, 0.32, 0.1], [-0.46, 0.12, 0.33, 0.1], [0.44, -0.2, 0.3, 0.09], [-0.32, -0.44, 0.25, 0.09], [0.02, -0.74, 0.22, 0.11]] },
    { id: 'sokan', name: '双干式', origin: '日式', d: '一个根上分出一高一矮两根主干',
        trunks: [[[0, 1], [-0.12, 0.4], [-0.15, -0.62]], [[0, 1], [0.14, 0.6], [0.32, 0.02]]],
        blobs: [[-0.56, 0.16, 0.3, 0.1], [-0.2, -0.3, 0.3, 0.1], [-0.15, -0.72, 0.22, 0.11], [0.62, 0.22, 0.28, 0.09], [0.34, -0.12, 0.24, 0.1]] },
    { id: 'bunjin', name: '文人木', origin: '日式', d: '主干瘦高曲折，只在顶上留一两片',
        trunks: [[[0, 1], [0.15, 0.45], [-0.1, -0.1], [0.12, -0.6]]],
        blobs: [[0.34, -0.7, 0.3, 0.09], [-0.2, -0.47, 0.2, 0.07], [0.14, -0.88, 0.15, 0.07]] },
    { id: 'fuki', name: '风吹式', origin: '日式', d: '枝叶全被风吹向一边',
        trunks: [[[0, 1], [0.28, 0.45], [0.55, -0.15]]],
        blobs: [[0.72, 0.38, 0.32, 0.08], [0.92, 0.06, 0.3, 0.08], [0.98, -0.24, 0.28, 0.08], [0.72, -0.36, 0.22, 0.08]] },
    { id: 'yunpian', name: '云片式', origin: '中式 · 扬派', d: '主干一寸三弯，叶层又薄又平，像一片片云',
        trunks: [[[0, 1], [-0.15, 0.72], [0.12, 0.46], [-0.12, 0.16], [0.1, -0.14], [-0.05, -0.5]]],
        blobs: [[-0.48, 0.3, 0.36, 0.065], [0.46, 0.05, 0.36, 0.065], [-0.42, -0.22, 0.32, 0.065], [0.36, -0.42, 0.3, 0.065], [-0.04, -0.66, 0.28, 0.075]] },
    { id: 'hankengai', name: '半悬崖', origin: '日式 · 中式', d: '主干横着伸出盆外', stand: true,
        trunks: [[[0, 1], [0.15, 0.75], [0.62, 0.8], [0.95, 0.95]]],
        blobs: [[0.92, 0.84, 0.3, 0.1], [0.48, 0.62, 0.25, 0.09], [-0.05, 0.45, 0.26, 0.12]] },
    { id: 'kengai', name: '悬崖式', origin: '日式 · 中式', d: '主干翻出盆沿，一路垂到盆下', stand: true,
        trunks: [[[0, 1], [0.1, 0.76], [0.45, 0.82], [0.7, 1.2], [0.82, 1.55]]],
        blobs: [[0.05, 0.55, 0.26, 0.12], [0.62, 1.0, 0.24, 0.09], [0.88, 1.32, 0.25, 0.09], [0.78, 1.62, 0.2, 0.08]] },
    { id: 'liutai', name: '六台三托一顶', origin: '中式 · 苏派', d: '左右六片「台」、背后三片「托」、顶上一片「顶」，规矩最严',
        trunks: [[[0, 1], [0.08, 0.5], [-0.06, 0.0], [0.03, -0.64]]],
        blobs: [[-0.5, 0.46, 0.27, 0.08], [0.5, 0.31, 0.27, 0.08], [-0.46, 0.1, 0.25, 0.08], [0.45, -0.06, 0.25, 0.08], [-0.38, -0.27, 0.21, 0.08], [0.36, -0.42, 0.21, 0.08],
            [0, 0.25, 0.17, 0.07], [0, -0.12, 0.15, 0.07], [0, -0.46, 0.13, 0.07], [0.02, -0.74, 0.19, 0.1]] },
];
const FORM = Object.fromEntries(FORMS.map(f => [f.id, f]));
const inBlobs = (f, u, v, k = 1, ky = k) => f.blobs.some(([cx, cy, rx, ry]) => ((u - cx) / (rx * k)) ** 2 + ((v - cy) / (ry * ky)) ** 2 <= 1);

// ============================================================
// 树种
// ============================================================
const SPECIES = [
    { id: 'ficus', name: '榕树', rar: 1, leaf: ['#3f6a34', '#5f8f48', '#86b062'], trunk: '#8a7a68', w: 1, shape: 'ficus', len: 0.085, n: 5, vein: true },
    { id: 'pine', name: '黑松', rar: 1, leaf: ['#22402b', '#3b6040', '#5f8a5c'], trunk: '#5e4a3e', w: 1, needle: true, len: 0.085, n: 12 },
    { id: 'maple', name: '红枫', rar: 2, leaf: ['#8a2f24', '#bd4a30', '#e2764a'], trunk: '#5c4a44', w: 0.9, shape: 'maple', len: 0.08, n: 4, vein: true },
    { id: 'ginkgo', name: '银杏', rar: 2, leaf: ['#b08a2a', '#d6b046', '#efd27a'], trunk: '#7a6656', w: 0.9, shape: 'ginkgo', len: 0.075, n: 4 },
    { id: 'elm', name: '金叶榆', rar: 2, leaf: ['#7a8634', '#a4ad50', '#cfd27e'], trunk: '#76654f', w: 0.9, shape: 'elm', len: 0.06, n: 6, vein: true },
    { id: 'sakura', name: '樱花', rar: 3, leaf: ['#d98ea4', '#efbccb', '#fbe6ec'], trunk: '#4e3a38', w: 0.8, petals: true, len: 0.05, n: 2 },
    { id: 'wisteria', name: '紫藤', rar: 3, leaf: ['#4a7440', '#6d9a58', '#98be7e'], trunk: '#6e5c4c', w: 0.8, shape: 'pinnate', raceme: '#a48ad4', len: 0.1, n: 3 },
];
const SPEC = Object.fromEntries(SPECIES.map(s => [s.id, s]));

// ============================================================
// 存档
// ============================================================
const SAVE_KEY = 'bonsai_v2';
let G = (() => { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && s.forms ? s : null; } catch (e) { return null; } })()
    || { coins: 30, forms: {}, species: { ficus: 1, pine: 1 }, garden: [], seen: false, cur: { form: 'chokkan', species: 'ficus' } };
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { } };
const unlocked = f => { const i = FORMS.indexOf(f); return i === 0 || !!G.forms[FORMS[i - 1].id]; };

// ============================================================
// 树：空间殖民生长
// ============================================================
let tree = null;
// 保证剪得出来：主干 + 每片叶层一根专属主枝（剪不动），叶层里只让这根主枝的后代去填 → 答案一定会完整长出来；
// 叶层外面另外撒"多余"的吸引点 → 徒长枝、乱芽、戳出叶层的长枝，这些才是要剪掉的。
function newTree(form, spec) {
    const t = { form, spec, nodes: [], pts: [], grid: new Map(), dirty: true, bloom: Math.random() < (spec.petals || spec.raceme ? 1 : 0.1), fruit: !spec.petals && !spec.raceme && Math.random() < 0.05,
        curl: rand(0.6, 1.2), iter: 0 };
    t.D = 0.042 * S; t.DI = 0.3 * S; t.DK = 0.07 * S; t.leafR = 0.055 * S; t.cap = 3000; t.dead = []; t.mature = false;
    let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
    for (const [cx, cy, rx, ry] of form.blobs) { x0 = Math.min(x0, cx - rx * 1.6); x1 = Math.max(x1, cx + rx * 1.6); y0 = Math.min(y0, cy - ry * 3); y1 = Math.max(y1, cy + ry * 3); }
    for (const l of form.trunks) for (const [u, v] of l) { x0 = Math.min(x0, u - 0.3); x1 = Math.max(x1, u + 0.3); y0 = Math.min(y0, v); y1 = Math.max(y1, v); }
    t.box = { x0, x1, y0, y1 };
    const root = addNode(t, U2X(0), U2Y(1), -1, { trunk: true, tk: 0 });

    bind();
}
function rollSeed() { const w = SPECIES.map(s => [0, 5, 3, 1.2][s.rar]); let r = Math.random() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < SPECIES.length; i++) if ((r -= w[i]) <= 0) return SPECIES[i]; return SPECIES[0]; }
// 造型格的小图：剪过的显示自己的作品，没剪过的显示剪影
function formThumb(f) {
    const w = G.best && G.best[f.id];
    return w ? `<img src="${w.img}" style="width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 40%;border-radius:10px;display:block">` : `<img src="${formIcon(f)}" style="width:100%">`;
}
// 观赏：大图 + 标准剪影对照 + 信息
function viewWork(fid, back) {
    const w = G.best[fid], f = FORM[fid], sp = SPEC[w.species];
    showCard(`<div class="ctop"><button class="btn ghost" id="vBack">返回</button><button class="btn green" id="vAgain">再剪一盆</button></div>
        <h2>${f.name}</h2><div class="sub" style="font-size:12px;margin-top:-2px">${f.origin} · ${f.d}</div>
        <div style="position:relative;margin:8px auto 4px;max-width:330px">
            <img src="${w.img}" style="width:100%;display:block;border-radius:16px;box-shadow:0 6px 18px rgba(60,40,20,.18)">
            <div style="position:absolute;right:8px;top:8px;width:64px;background:rgba(255,255,255,.85);border-radius:10px;padding:3px"><img src="${formIcon(f)}" style="width:100%;display:block"><div style="font-size:9px;font-weight:800;opacity:.6">标准剪影</div></div>
        </div>
        <div class="stars">${'★'.repeat(w.stars)}${'☆'.repeat(3 - w.stars)}</div>
        <div class="sub">${sp.name}${w.bloom ? ' · 开花了 🌸' : ''} · 完成度 <b>${w.sim}%</b></div>`);
    $('vBack').onclick = back;
    $('vAgain').onclick = () => { pickF = fid; setupCard(); };
}
function bookCard() {
    showCard(`<div class="ctop"><button class="btn" id="cClose">关闭</button></div><h2>图鉴</h2>
        <h3>造型 ${FORMS.filter(f => G.forms[f.id]).length}/${FORMS.length}</h3><div class="chips">${FORMS.map(f => `<div class="chip ${G.forms[f.id] ? '' : 'off'}" data-v="${f.id}">${formThumb(f)}${f.name}<small>${G.forms[f.id] ? '★'.repeat(G.forms[f.id]) + '☆'.repeat(3 - G.forms[f.id]) : '未完成'}</small></div>`).join('')}</div>
        <h3>树种 ${SPECIES.filter(s => G.species[s.id]).length}/${SPECIES.length}</h3><div class="chips">${SPECIES.map(s => `<div class="chip ${G.species[s.id] ? '' : 'off'}"><img src="${specIcon(s)}" style="width:100%;${G.species[s.id] ? '' : 'filter:grayscale(1) brightness(1.4)'}">${G.species[s.id] ? s.name : '？？？'}<small>${'★'.repeat(s.rar)}</small></div>`).join('')}</div>
        <div class="sub" style="font-size:12px;margin-top:8px">剪好的造型会换成你的作品，点开可以观赏 · 新树种从「神秘种子」里开</div>`);
    $('cClose').onclick = hideCard;
    $('card').querySelectorAll('[data-v]').forEach(el => el.onclick = () => { if (G.best && G.best[el.dataset.v]) viewWork(el.dataset.v, bookCard); });
}
function gardenCard() {
    showCard(`<div class="ctop"><button class="btn" id="cClose">关闭</button></div><h2>我的盆景园</h2>
        ${G.garden.length ? `<div class="garden">${G.garden.map(w => `<div><img src="${w.img}">${FORM[w.form].name}<br><span style="color:#f0a020">${'★'.repeat(w.stars)}</span> ${SPEC[w.species].name}${w.bloom ? ' 🌸' : ''}</div>`).join('')}</div>` : '<div class="sub">还没有作品，修好第一盆就会摆在这里</div>'}`);
    $('cClose').onclick = hideCard;
}
$('bookBtn').onclick = () => { audio(); bookCard(); };
$('gardenBtn').onclick = () => { audio(); gardenCard(); };
$('doneBtn').onclick = finish;

// ============================================================
// 输入：手指划过 = 剪刀
// ============================================================
let ptr = null, trail = [];
cvs.addEventListener('pointerdown', e => { audio(); stroke = { cuts: 0, shown: 1, brushed: 0 }; ptr = { x: e.clientX, y: e.clientY, t: performance.now() }; trail = [{ x: e.clientX, y: e.clientY, t: T }]; cvs.setPointerCapture(e.pointerId); });
cvs.addEventListener('pointermove', e => {
    if (!ptr) return;
    const now = performance.now(), dt = Math.max(1, now - ptr.t) / 1000, vx = (e.clientX - ptr.x) / dt, vy = (e.clientY - ptr.y) / dt;
    if (tree && phase === 'live') { cutAlong(tree, ptr.x, ptr.y, e.clientX, e.clientY, vx, vy); cutPieces(ptr.x, ptr.y, e.clientX, e.clientY, vx, vy); brushLeaves(tree, ptr.x, ptr.y, e.clientX, e.clientY, vx, vy); }
    ptr = { x: e.clientX, y: e.clientY, t: now }; trail.push({ x: e.clientX, y: e.clientY, t: T });
});
const up = () => { ptr = null; };
cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up);
function drawTrail() {
    trail = trail.filter(p => T - p.t < 0.25); if (trail.length < 2) return;
    ctx.lineCap = 'round'; for (let i = 1; i < trail.length; i++) { const a = 1 - (T - trail[i].t) / 0.25; ctx.strokeStyle = `rgba(255,255,255,${0.75 * a})`; ctx.lineWidth = 6 * a; ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke(); }
    // 剪刀图标跟着手指
    if (ptr) { ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✂️', ptr.x + 18, ptr.y - 18); }
}

// ============================================================
// UI 小工具 / 主循环
// ============================================================
function popText(x, y, t, cls = '') { const el = document.createElement('div'); el.className = 'pop ' + cls; el.textContent = t; el.style.left = clamp(x, 80, W - 80) + 'px'; el.style.top = y + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 1300); }
function renderHud() { $('coins').textContent = G.coins; }
let taps = [];
$('coinPill').addEventListener('pointerdown', () => { const now = performance.now(); taps = taps.filter(t => now - t < 2000); taps.push(now); if (taps.length >= 5) { taps = []; G.coins += 500; renderHud(); save(); popText(W / 2, H * 0.3, '调试：+500'); } });
function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cvs.width = W * DPR; cvs.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const top = document.querySelector('.hud').getBoundingClientRect().bottom, bot = document.querySelector('.bottom').getBoundingClientRect().top;
    S = Math.min(W * 0.4, (bot - top) * 0.3); ROOT_X = W / 2; TABLE_Y = bot - 0.42 * S; ROOT_Y = TABLE_Y - 0.36 * S;
    clearLitter();
    if (tree) startRound(tree.form.id, tree.spec.id);
}
addEventListener('resize', resize); resize();
let last = performance.now();
function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now; T += dt;
    let pdt = dt; if (hitStop > 0) { hitStop -= dt; pdt = 0; }   // 一刀多枝时顿一下
    updateTree(dt); updatePieces(pdt); sway.t += pdt;
    drawScene();
    drawPot();
    ctx.drawImage(litterCv, 0, 0, W, H);
    drawCeleBack();
    if (tree) {
        // 挨一刀后的弹簧晃动：以盆口为轴，越往上晃得越多
        const k = sway.A * Math.exp(-9 * sway.t) * Math.sin(20 * sway.t) * sway.dir;
        if (Math.abs(k) > 0.0005) { ctx.save(); ctx.transform(1, 0, -k, 1, k * ROOT_Y, 0); ctx.drawImage(treeCv, 0, 0, W, H); ctx.restore(); } else ctx.drawImage(treeCv, 0, 0, W, H);
    }
    drawCeleFront(pdt);
    drawPieces(); drawTrail();
    requestAnimationFrame(frame);
}
renderHud();
if (!G.seen) {
    showCard(`<div class="ctop"><button class="btn green" id="cGo">开始</button></div>
        <div style="font-size:44px">🌳✂️</div><h2>盆景剪影</h2>
        <div class="sub" style="text-align:left;display:inline-block;font-size:15px">
        ① 小树苗会自己<b>一边长一边分叉</b><br>
        ② <b>手指划过枝条</b>就能剪，剪掉的分叉<b>不会再往那边长</b><br>
        ③ 照着<b>右上角的剪影</b>，把它修成那个造型<br>
        ④ 完成度 55% / 75% / 88% 分别是 1~3 星；叶层全留住、多余的全剪掉就是 100%，点「完成」收进园子<br>
        <span style="opacity:.7;font-size:13px">每完成一个造型解锁下一个；神秘种子里有樱花、紫藤</span></div>`);
    $('cGo').onclick = () => { G.seen = true; save(); audio(); setupCard(); };
} else setupCard();
requestAnimationFrame(frame);
</script>
</body>
